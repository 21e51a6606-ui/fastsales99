# Nginx site - copy to /etc/nginx/sites-available/fastsales99 and symlink into sites-enabled.
# Replace YOUR_DOMAIN. After DNS points here, run: sudo certbot --nginx -d YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN;
    client_max_body_size 10m;

    # Serve static assets directly
    location /static/ {
        alias /opt/fastsales99/frontend/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
