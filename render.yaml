# Render Blueprint (free tier): https://render.com/docs/blueprint-spec
# In Render: New -> Blueprint -> pick this repo. You will be asked for DATABASE_URL (from Neon),
# ADMIN_EMAIL and ADMIN_PASSWORD.
services:
  - type: web
    name: fastsales99
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/ping
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
